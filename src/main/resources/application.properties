# App settings only. The user's routine lives in ~/.config/morning/config.yaml (ADR-0008).
morning.github.graphql-url=https://api.github.com/graphql

# A CLI: no banner, quiet console, diagnostics on stderr. Never log request headers.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.stderr=true
quarkus.log.category."org.apache.http".level=WARN

# Tests never talk to GitHub: PrsCommandTest points this at a local WireMock.
%test.morning.github.graphql-url=http://localhost:1/graphql
